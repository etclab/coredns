# Unbound configuration for CODoH benchmarking
# Listens on port 5353 to avoid conflicting with systemd-resolved
# 24h minimum TTL ensures cached entries survive the entire benchmark session

server:
    interface: 127.0.0.1
    port: 5353
    do-not-query-localhost: no
    access-control: 127.0.0.0/8 allow

    # Cache settings for benchmarking
    cache-min-ttl: 86400
    cache-max-ttl: 86400
    msg-cache-size: 128m
    rrset-cache-size: 256m

    # Disable prefetch — clean measurement
    prefetch: no
    prefetch-key: no

    # Privacy (irrelevant for local use, but good defaults)
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Performance
    num-threads: 4
    so-reuseport: yes

    # Logging (minimal for benchmarks)
    verbosity: 0
    log-queries: no
    log-replies: no
